[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent"
version = "0.1.0"
description = "Autonomous Red-Team Fuzzing & WebAssembly Runtime Containment for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AegisAgent Security Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "wasmtime>=48.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
wasmer = [
    "wasmer-sdk>=0.2.0; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
