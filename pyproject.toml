[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent"
version = "0.1.0"
description = "Autonomous Red-Team Fuzzing & WebAssembly Runtime Containment for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AegisAgent Security Team" }
]
# Core runtime dependencies only — no test or LLM-API deps here
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "wasmtime>=48.0.0",
]

[project.optional-dependencies]
# LLM API integration (optional — only needed for live agent reasoning)
llm = [
    "openai>=1.0.0",
]
# Wasmer SDK (Linux/macOS only — not available on Windows)
wasmer = [
    "wasmer-sdk>=0.2.0; sys_platform != 'win32'",
]
# Development & testing
dev = [
    "pytest>=8.0.0",
]
# Dashboard & SIEM server
dashboard = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]
exclude = ["deploy*", "dashboard*", "tests*", "tasks*"]

